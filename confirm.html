<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Know Me</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f4;color:#16211f;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
  .card{background:#fff;border-radius:16px;padding:32px;max-width:420px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .bar{background:#0f6b5c;color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block;margin-bottom:16px;}
</style>
</head>
<body>
  <div class="card">
    <div class="bar">Know Me</div>
    <p id="msg">Cargando…</p>
  </div>
<script>
  var params = new URLSearchParams(location.search);
  document.getElementById('msg').textContent = params.get('message') || 'Listo.';
</script>
</body>
</html>
