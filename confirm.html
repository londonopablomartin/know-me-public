<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Know Me</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#1f2a44;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
  .card{background:#fff;border-radius:16px;padding:32px;max-width:420px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .bar{background:#0e7f86;color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block;margin-bottom:16px;}
</style>
</head>
<body>
  <div class="card">
    <div class="bar">Know Me</div>
    <p id="msg">Cargando…</p>
  </div>
<script>
  // Solo se muestran textos fijos según un código: el enlace no puede escribir mensajes propios.
  var MESSAGES = {
    invalid: 'Solicitud inválida o enlace incompleto.',
    expired: 'Esta solicitud venció. Pide que la envíen de nuevo desde la app.',
    unauthorized: 'No autorizado para revisar esta solicitud.',
    done: 'Listo.'
  };
  var code = new URLSearchParams(location.search).get('c');
  document.getElementById('msg').textContent = Object.prototype.hasOwnProperty.call(MESSAGES, code) ? MESSAGES[code] : MESSAGES.done;
</script>
</body>
</html>
