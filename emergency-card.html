<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Ficha de emergencia — Know Me</title>
<style>
  :root {
    --bg: #0B1220; --card: #121A2B; --chip: #1C2842; --text: #F1F5F9; --muted: #94A3B8; --line: #273449;
    --sos: #DC2626; --onsos: #FFFFFF;
    --call: #2DD4C7; --oncall: #0B1220;
    --amber: #FBBF24; --onamber: #0B1220;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F8FAFC; --card: #FFFFFF; --chip: #E2E8F0; --text: #0F172A; --muted: #475569; --line: #CBD5E1;
      --call: #00847A; --oncall: #FFFFFF;
      --amber: #B45309; --onamber: #FFFFFF;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px; line-height: 1.45;
  }
  .bar { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  .bar svg { width: 32px; height: 32px; flex: none; }
  .brand { font-weight: 700; font-size: 18px; line-height: 1.1; }
  .sub { font-size: 14px; color: var(--muted); }
  .page { max-width: 520px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 32px; line-height: 1.15; margin: 0; font-weight: 700; }
  .sos { display: flex; flex-direction: column; gap: 8px; }
  .call-sos {
    display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 64px;
    background: var(--sos); color: var(--onsos); text-decoration: none; font-weight: 700; font-size: 20px;
    border-radius: 16px; padding: 12px 16px;
  }
  .call-sos svg, .contact svg { width: 24px; height: 24px; flex: none; }
  .ghost {
    min-height: 56px; width: 100%; background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 16px; font-size: 16px; font-weight: 600; padding: 12px 16px; cursor: pointer; font-family: inherit;
  }
  .ghost:disabled { opacity: .6; }
  .hint { font-size: 14px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .card.alert { border-color: var(--amber); }
  .label { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  .chip {
    display: inline-block; background: var(--chip); color: var(--text); border-radius: 12px;
    padding: 10px 16px; margin: 0 8px 8px 0; font-size: 20px; font-weight: 600;
  }
  .chip.alert { background: var(--amber); color: var(--onamber); }
  .empty { color: var(--muted); font-size: 16px; margin: 0; }
  .blood { font-size: 56px; line-height: 1; font-weight: 800; }
  .contact {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px;
    background: var(--call); color: var(--oncall); text-decoration: none; border-radius: 16px;
    padding: 12px 16px; margin-bottom: 8px;
  }
  .contact:last-child { margin-bottom: 0; }
  .contact .name { font-weight: 700; font-size: 20px; line-height: 1.2; }
  .contact .rel { font-size: 14px; opacity: .85; }
  .contact .num { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .center { text-align: center; padding: 48px 8px; color: var(--muted); }
  .note { font-size: 14px; color: var(--muted); text-align: center; }
  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 8px 24px 32px; }
  .hosp-list { display: flex; flex-direction: column; gap: 8px; }
  .hosp-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .hosp-name { font-weight: 700; font-size: 16px; }
  .hosp-dist { font-size: 14px; color: var(--muted); }
  .hosp-actions a { color: var(--text); font-weight: 600; font-size: 14px; white-space: nowrap; padding: 12px 0 12px 12px; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>
  <header class="bar">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="11" y1="11" x2="105" y2="105">
          <stop offset="0" stop-color="#FF5470"/><stop offset="1" stop-color="#E11D48"/>
        </linearGradient>
      </defs>
      <line x1="72" y1="72" x2="99" y2="99" stroke="url(#g)" stroke-width="12"/>
      <circle cx="99" cy="99" r="6" fill="url(#g)"/>
      <circle cx="48" cy="48" r="32" fill="none" stroke="url(#g)" stroke-width="10"/>
    </svg>
    <div><div class="brand">Know Me</div><div class="sub">Ficha de emergencia</div></div>
  </header>
  <main class="page">
    <div id="who"></div>
    <section class="sos" aria-label="Pedir ayuda">
      <a class="call-sos" href="tel:123">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        Llamar a emergencias · 123
      </a>
      <button class="ghost" id="find-hospitals-btn" type="button">Ver hospitales cercanos</button>
      <div id="hosp-status" class="hint" role="status"></div>
      <div id="hosp-list" class="hosp-list"></div>
    </section>
    <div id="content"><div class="center">Cargando…</div></div>
  </main>
  <footer>Esta ficha no reemplaza atención médica profesional. Información confidencial: úsala solo para atender una emergencia real.</footer>
<script>
  var SUPABASE_URL = "https://povrmihhykldhelqymvo.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvdnJtaWhoeWtsZGhlbHF5bXZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODM3NDYsImV4cCI6MjEwMjA1OTc0Nn0.paKTfCngiGYXxi3ZyxMP80faNCs77xAYnk4tKyinBxA";

  var PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function chipList(items, alertStyle) {
    if (!items || items.length === 0) return '<p class="empty">Sin información registrada.</p>';
    var out = '';
    for (var i = 0; i < items.length; i++) {
      out += '<span class="chip' + (alertStyle ? ' alert' : '') + '">' + escapeHtml(items[i]) + '</span>';
    }
    return out;
  }
  function section(label, body, extraClass) {
    return '<section class="card' + (extraClass ? ' ' + extraClass : '') + '"><div class="label">' + label + '</div>' + body + '</section>';
  }

  function render(html) {
    document.getElementById('content').innerHTML = html;
  }

  function load() {
    var params = new URLSearchParams(location.search);
    var token = params.get('token');
    if (!token) {
      render('<div class="center">Falta el código en el link.</div>');
      return;
    }
    fetch(SUPABASE_URL + '/rest/v1/rpc/resolve_emergency_qr', {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_token: token }),
    })
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (data && data.error) {
          var messages = {
            not_found: 'Este código no corresponde a ningún perfil de emergencia.',
            revoked: 'Este código fue reemplazado por uno nuevo y ya no es válido.',
            expired: 'Este código ya expiró.',
          };
          render('<div class="center">' + (messages[data.error] || 'No se pudo leer la información.') + '</div>');
          return;
        }
        var contacts = (data && data.contacts) || [];
        var contactsHtml = contacts.length === 0
          ? '<p class="empty">No hay contactos registrados.</p>'
          : contacts.map(function (c) {
              return '<a class="contact" href="tel:' + escapeHtml(c.phone) + '">' +
                '<span><span class="name">' + escapeHtml(c.full_name) + '</span>' +
                (c.relationship ? '<br><span class="rel">' + escapeHtml(c.relationship) + '</span>' : '') + '</span>' +
                '<span class="num">' + PHONE_ICON + escapeHtml(c.phone) + '</span></a>';
            }).join('');

        if (data && data.full_name) {
          document.getElementById('who').innerHTML = '<h1>' + escapeHtml(data.full_name) + '</h1>';
        }

        var hasAllergies = data && data.allergies && data.allergies.length > 0;
        render(
          section('Alergias', chipList(data && data.allergies, true), hasAllergies ? 'alert' : '') +
          section('Condiciones médicas', chipList(data && data.conditions)) +
          section('Contacto de emergencia', contactsHtml) +
          section('Tipo de sangre', (function () {
            var bt = (data && data.blood_type) || '';
            return bt
              ? '<div class="blood">' + escapeHtml(bt) + '</div>'
              : '<p class="empty">No especificado.</p>';
          })()) +
          section('Medicamentos', chipList(data && data.medications))
        );
      })
      .catch(function () {
        render('<div class="center">No se pudo cargar la información. Intenta de nuevo.</div>');
      });
  }

  load();

  function findNearbyHospitals() {
    var statusEl = document.getElementById('hosp-status');
    var listEl = document.getElementById('hosp-list');
    var btn = document.getElementById('find-hospitals-btn');
    listEl.innerHTML = '';

    if (!navigator.geolocation) {
      statusEl.textContent = 'Este navegador no soporta ubicación. Usa el mapa de tu teléfono para buscar el hospital más cercano.';
      return;
    }

    btn.disabled = true;
    statusEl.textContent = 'Buscando tu ubicación…';

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        statusEl.textContent = 'Buscando hospitales cerca de ti…';

        fetch(SUPABASE_URL + '/functions/v1/nearby-hospitals', {
          method: 'POST',
          headers: {
            'apikey': ANON_KEY,
            'Authorization': 'Bearer ' + ANON_KEY,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ lat: lat, lon: lon, radius: 5000 }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var items = (data && data.hospitals) || [];
            var results = [];
            for (var i = 0; i < items.length; i++) {
              var h = items[i];
              if (!h.name || h.lat == null || h.lon == null) continue;
              results.push({
                name: h.name,
                lat: h.lat,
                lon: h.lon,
                dist: h.distance_meters != null ? h.distance_meters : distanceMeters(lat, lon, h.lat, h.lon),
              });
            }
            results.sort(function (a, b) { return a.dist - b.dist; });
            results = results.slice(0, 8);

            if (results.length === 0) {
              statusEl.textContent = 'No encontramos hospitales registrados cerca de tu ubicación.';
              btn.disabled = false;
              return;
            }
            statusEl.textContent = '';
            listEl.innerHTML = results.map(function (h) {
              var distText = h.dist < 1000 ? Math.round(h.dist) + ' m' : (h.dist / 1000).toFixed(1) + ' km';
              return '<div class="hosp-item">' +
                '<div><div class="hosp-name">' + escapeHtml(h.name) + '</div><div class="hosp-dist">A ' + distText + '</div></div>' +
                '<div class="hosp-actions"><a href="https://www.google.com/maps/dir/?api=1&destination=' + h.lat + ',' + h.lon + '" target="_blank" rel="noopener">Cómo llegar</a></div>' +
                '</div>';
            }).join('');
            btn.disabled = false;
          })
          .catch(function () {
            statusEl.textContent = 'No se pudo cargar la lista de hospitales. Intenta de nuevo.';
            btn.disabled = false;
          });
      },
      function () {
        statusEl.textContent = 'No pudimos acceder a tu ubicación. Revisa el permiso de ubicación del navegador e intenta de nuevo.';
        btn.disabled = false;
      },
      { enableHighAccuracy: false, timeout: 10000 }
    );
  }

  function distanceMeters(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  document.getElementById('find-hospitals-btn').addEventListener('click', findNearbyHospitals);
</script>
</body>
</html>
