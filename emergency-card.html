<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha de emergencia — Know Me</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f5f4; color: #16211f;
  }
  .bar { background: #0f6b5c; color: #fff; padding: 16px 20px; font-weight: 700; font-size: 18px; }
  .page { max-width: 480px; margin: 0 auto; padding: 20px; }
  .warning {
    background: #f5e6d0; color: #7a4a10; border-radius: 12px; padding: 14px 16px;
    font-size: 14px; margin-bottom: 20px; text-align: center;
  }
  .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #6b7a72; margin-bottom: 6px; font-weight: 600; }
  .blood { font-size: 40px; font-weight: 800; color: #0f6b5c; }
  .chip { display: inline-block; background: #dceee9; color: #0f6b5c; border-radius: 999px; padding: 6px 14px; margin: 4px 6px 4px 0; font-size: 14px; font-weight: 600; }
  .empty { color: #6b7a72; font-size: 14px; }
  .contact { padding: 10px 0; border-bottom: 1px solid #e5e9e6; }
  .contact:last-child { border-bottom: none; }
  .contact .name { font-weight: 700; }
  .contact .phone { color: #0f6b5c; font-weight: 600; }
  .center { text-align: center; padding: 60px 20px; }
  footer { text-align: center; font-size: 12px; color: #6b7a72; padding: 24px; }
  .sos-card { background: #fdece6; border-radius: 16px; padding: 18px 20px; margin-bottom: 20px; text-align: center; }
  .sos-title { font-weight: 700; color: #9a2b0e; margin-bottom: 12px; }
  .call-btn {
    display: block; background: #c62f0a; color: #fff; text-decoration: none; font-weight: 700;
    font-size: 16px; padding: 14px 16px; border-radius: 12px; margin-bottom: 8px;
  }
  .hospitals-btn {
    display: block; width: 100%; background: #fff; color: #9a2b0e; border: 1px solid #e3b6a6;
    font-weight: 600; font-size: 14px; padding: 12px 16px; border-radius: 12px; cursor: pointer;
  }
  .hosp-hint { font-size: 12px; color: #7a4a10; margin-top: 8px; }
  .hosp-list { text-align: left; margin-top: 14px; }
  .hosp-item { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hosp-name { font-weight: 700; font-size: 14px; }
  .hosp-dist { font-size: 12px; color: #6b7a72; }
  .hosp-actions a { font-size: 12px; color: #0f6b5c; font-weight: 600; text-decoration: none; margin-left: 10px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="bar">🩺 Know Me — Ficha de emergencia</div>
  <div class="page">
    <div class="sos-card">
      <div class="sos-title">¿Hay una vida en riesgo ahora?</div>
      <a class="call-btn" href="tel:123">📞 Llamar a emergencias (123)</a>
      <button class="hospitals-btn" id="find-hospitals-btn" type="button">📍 Ver hospitales cercanos</button>
      <div id="hosp-status" class="hosp-hint"></div>
      <div id="hosp-list" class="hosp-list"></div>
    </div>
    <div id="content"><div class="center"><p>Cargando…</p></div></div>
  </div>
  <footer>Know Me · Esta información es confidencial, úsala solo para atender una emergencia real.</footer>
<script>
  var SUPABASE_URL = "https://povrmihhykldhelqymvo.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvdnJtaWhoeWtsZGhlbHF5bXZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODM3NDYsImV4cCI6MjEwMjA1OTc0Nn0.paKTfCngiGYXxi3ZyxMP80faNCs77xAYnk4tKyinBxA";

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function chipList(items) {
    if (!items || items.length === 0) return '<p class="empty">Sin información registrada.</p>';
    var out = '';
    for (var i = 0; i < items.length; i++) out += '<span class="chip">' + escapeHtml(items[i]) + '</span>';
    return out;
  }

  function render(html) {
    document.getElementById('content').innerHTML = html;
  }

  function load() {
    var params = new URLSearchParams(location.search);
    var token = params.get('token');
    if (!token) {
      render('<div class="center"><p>Falta el código en el link.</p></div>');
      return;
    }
    fetch(SUPABASE_URL + '/rest/v1/rpc/resolve_emergency_qr', {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_token: token }),
    })
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (data && data.error) {
          var messages = {
            not_found: 'Este código no corresponde a ningún perfil de emergencia.',
            revoked: 'Este código fue reemplazado por uno nuevo y ya no es válido.',
            expired: 'Este código ya expiró.',
          };
          render('<div class="center"><p>' + (messages[data.error] || 'No se pudo leer la información.') + '</p></div>');
          return;
        }
        var contacts = (data && data.contacts) || [];
        var contactsHtml = contacts.length === 0
          ? '<p class="empty">No hay contactos registrados.</p>'
          : contacts.map(function (c) {
              return '<div class="contact"><div class="name">' + escapeHtml(c.full_name) +
                (c.relationship ? ' · ' + escapeHtml(c.relationship) : '') +
                '</div><div class="phone"><a href="tel:' + escapeHtml(c.phone) + '" style="color:inherit;text-decoration:none;">' +
                escapeHtml(c.phone) + '</a></div></div>';
            }).join('');

        var nameHtml = (data && data.full_name)
          ? '<h1 style="font-size:20px;margin:0 0 14px;">' + escapeHtml(data.full_name) + '</h1>'
          : '';

        render(
          nameHtml +
          '<div class="warning">Esta ficha no reemplaza atención médica profesional. Ante una emergencia, contacta primero a los servicios de emergencia de tu país.</div>' +
          '<div class="card"><div class="label">Tipo de sangre</div><div class="blood">' + escapeHtml((data && data.blood_type) || 'No especificado') + '</div></div>' +
          '<div class="card"><div class="label">Alergias</div>' + chipList(data && data.allergies) + '</div>' +
          '<div class="card"><div class="label">Condiciones médicas</div>' + chipList(data && data.conditions) + '</div>' +
          '<div class="card"><div class="label">Medicamentos</div>' + chipList(data && data.medications) + '</div>' +
          '<div class="card"><div class="label">Contactos de emergencia</div>' + contactsHtml + '</div>'
        );
      })
      .catch(function () {
        render('<div class="center"><p>No se pudo cargar la información. Intenta de nuevo.</p></div>');
      });
  }

  load();

  function findNearbyHospitals() {
    var statusEl = document.getElementById('hosp-status');
    var listEl = document.getElementById('hosp-list');
    var btn = document.getElementById('find-hospitals-btn');
    listEl.innerHTML = '';

    if (!navigator.geolocation) {
      statusEl.textContent = 'Este navegador no soporta ubicación. Usa el mapa de tu teléfono para buscar el hospital más cercano.';
      return;
    }

    btn.disabled = true;
    statusEl.textContent = 'Buscando tu ubicación…';

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        statusEl.textContent = 'Buscando hospitales cerca de ti…';

        fetch(SUPABASE_URL + '/functions/v1/nearby-hospitals', {
          method: 'POST',
          headers: {
            'apikey': ANON_KEY,
            'Authorization': 'Bearer ' + ANON_KEY,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ lat: lat, lon: lon, radius: 5000 }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var items = (data && data.hospitals) || [];
            var results = [];
            for (var i = 0; i < items.length; i++) {
              var h = items[i];
              if (!h.name || h.lat == null || h.lon == null) continue;
              results.push({
                name: h.name,
                lat: h.lat,
                lon: h.lon,
                dist: h.distance_meters != null ? h.distance_meters : distanceMeters(lat, lon, h.lat, h.lon),
              });
            }
            results.sort(function (a, b) { return a.dist - b.dist; });
            results = results.slice(0, 8);

            if (results.length === 0) {
              statusEl.textContent = 'No encontramos hospitales registrados cerca de tu ubicación.';
              btn.disabled = false;
              return;
            }
            statusEl.textContent = '';
            listEl.innerHTML = results.map(function (h) {
              var distText = h.dist < 1000 ? Math.round(h.dist) + ' m' : (h.dist / 1000).toFixed(1) + ' km';
              return '<div class="hosp-item">' +
                '<div><div class="hosp-name">' + escapeHtml(h.name) + '</div><div class="hosp-dist">A ' + distText + '</div></div>' +
                '<div class="hosp-actions"><a href="https://www.google.com/maps/dir/?api=1&destination=' + h.lat + ',' + h.lon + '" target="_blank" rel="noopener">Cómo llegar</a></div>' +
                '</div>';
            }).join('');
            btn.disabled = false;
          })
          .catch(function () {
            statusEl.textContent = 'No se pudo cargar la lista de hospitales. Intenta de nuevo.';
            btn.disabled = false;
          });
      },
      function () {
        statusEl.textContent = 'No pudimos acceder a tu ubicación. Revisa el permiso de ubicación del navegador e intenta de nuevo.';
        btn.disabled = false;
      },
      { enableHighAccuracy: false, timeout: 10000 }
    );
  }

  function distanceMeters(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  document.getElementById('find-hospitals-btn').addEventListener('click', findNearbyHospitals);
</script>
</body>
</html>
